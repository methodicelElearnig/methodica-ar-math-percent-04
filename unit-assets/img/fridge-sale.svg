<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" role="img" aria-label="ثلاجة عليها لافتة خصم 10%">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ecf2"/><stop offset="0.5" stop-color="#f7f8fb"/><stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8bfca"/><stop offset="0.5" stop-color="#e4e8ee"/><stop offset="1" stop-color="#aab2be"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <!-- floor shadow -->
  <ellipse cx="210" cy="500" rx="150" ry="14" fill="#000" opacity="0.10"/>
  <!-- fridge body -->
  <g filter="url(#sh)">
    <rect x="80" y="30" width="260" height="460" rx="22" fill="url(#body)" stroke="#c3c9d3" stroke-width="3"/>
  </g>
  <!-- freezer / fridge split -->
  <line x1="80" y1="190" x2="340" y2="190" stroke="#c3c9d3" stroke-width="3"/>
  <!-- handles -->
  <rect x="104" y="70" width="14" height="90" rx="7" fill="url(#steel)"/>
  <rect x="104" y="220" width="14" height="150" rx="7" fill="url(#steel)"/>
  <!-- feet -->
  <rect x="100" y="488" width="30" height="12" rx="4" fill="#9aa2ae"/>
  <rect x="290" y="488" width="30" height="12" rx="4" fill="#9aa2ae"/>
  <!-- sale sign hanging on the door -->
  <g transform="translate(150 240) rotate(-6)">
    <line x1="60" y1="-26" x2="60" y2="0" stroke="#8a4b12" stroke-width="3"/>
    <circle cx="60" cy="-28" r="5" fill="#8a4b12"/>
    <rect x="0" y="0" width="160" height="104" rx="12" fill="#e53935" stroke="#b71c1c" stroke-width="4"/>
    <rect x="8" y="8" width="144" height="88" rx="8" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="80" y="48" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-weight="800" font-size="40" fill="#fff" direction="ltr">10%</text>
    <text x="80" y="84" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-weight="700" font-size="28" fill="#fff" direction="rtl">خصم</text>
  </g>
</svg>
